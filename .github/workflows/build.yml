name: Build
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        shell: powershell
        run: |
          dotnet restore
          dotnet build Gnoss.Apiwrapper.csproj --no-restore
